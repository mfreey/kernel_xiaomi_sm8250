name: Build munch Kernel

on:
  workflow_dispatch:
    inputs:
      defconfig_name:
        description: 'Defconfig base name'
        required: false
        default: 'kona_defconfig'
      device_frag:
        description: 'Device config fragment'
        required: false
        default: 'xiaomi/munch.config'
      lto:
        description: 'LTO mode (full | thin | none)'
        required: false
        default: 'full'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cpio dwarves libncurses-dev zstd bc bison flex libelf-dev openssl libssl-dev lz4 perl zip unzip curl wget git gcc-arm-linux-gnueabi gcc-aarch64-linux-gnu

      - name: Download ZyCromerZ Clang toolchain
        run: |
          rm -rf /tmp/clang-extract $HOME/clang
          TC_VER="16.0.6-20260807"
          TC_URL="https://github.com/ZyCromerZ/Clang/releases/download/${TC_VER}-release/Clang-${TC_VER}.tar.gz"
          echo "Downloading $TC_URL ..."
          wget -q "$TC_URL" -O /tmp/clang.tar.gz
          mkdir -p /tmp/clang-extract
          tar xf /tmp/clang.tar.gz -C /tmp/clang-extract
          rm -f /tmp/clang.tar.gz
          # 不假设 tarball 布局，直接定位 bin/clang 的真实位置
          # bin/clang 在 LLVM 发布包中常为符号链接，不能用 -type f 过滤
          CLANG_BIN=$(find /tmp/clang-extract -name clang -path "*bin/*" | head -1)
          if [ -z "$CLANG_BIN" ]; then
            echo "!! clang binary not found in tarball, top-level layout:"
            find /tmp/clang-extract -maxdepth 3 | head -30
            exit 1
          fi
          TC_ROOT=$(dirname "$(dirname "$CLANG_BIN")")
          echo "Toolchain root: $TC_ROOT"
          mkdir -p $HOME/clang
          mv "$TC_ROOT"/* $HOME/clang/
          rm -rf /tmp/clang-extract
          $HOME/clang/bin/clang --version | head -2
          ls -la $HOME/clang/bin/ld.lld $HOME/clang/bin/llvm-ar

      - name: Set up environment
        run: |
          echo "DEFCONFIG=${{ github.event.inputs.defconfig_name || 'kona_defconfig' }}" >> $GITHUB_ENV
          echo "DEVICE_FRAG=${{ github.event.inputs.device_frag || 'xiaomi/munch.config' }}" >> $GITHUB_ENV
          echo "LTO=${{ github.event.inputs.lto || 'full' }}" >> $GITHUB_ENV
          echo "KBUILD_BUILD_TIMESTAMP=Thu Jan 1 00:00:00 UTC 1970" >> $GITHUB_ENV

      - name: Generate defconfig
        run: |
          # 生成基础 defconfig（defconfig 在 vendor/ 子目录，必须用 vendor/kona_defconfig 调用）
          make O=out ARCH=arm64 vendor/${DEFCONFIG}
          # 追加设备碎片并重新解析依赖
          if [ -f "arch/arm64/configs/vendor/${DEVICE_FRAG}" ]; then
            cat "arch/arm64/configs/vendor/${DEVICE_FRAG}" >> out/.config
            # 修复：BOARD_MUNCH 等符号在 Kconfig.platforms 中包在 if BOARD_XIAOMI 条件块内，
            # 碎片未开父开关会被 olddefconfig 静默丢弃，这里补上父开关
            echo "CONFIG_BOARD_XIAOMI=y" >> out/.config
            # diphons cpuset_assist 补丁：cpuset_write_resmask_assist（cpuset.c:1936）无条件引用
            # struct cs_target（定义在 #ifdef CONFIG_CPUSET_ASSIST 内），不开该配置即编译失败
            # （Run#8 实测 cpuset.c:1937 incomplete type）。该特性也是调度优化一部分，显式开启
            echo "CONFIG_CPUSET_ASSIST=y" >> out/.config
            # 开启小米触摸特性：Run#13 实测 focaltech_3658u 的 fts_update_gesture_state
            # (core.c L1933) 与 gesture.c L355/358 裸引用 ts_data->gesture_status，
            # 而该成员仅存在于 #ifdef CONFIG_TOUCHSCREEN_XIAOMI_TOUCHFEATURE
            # (core.h L239-246)。开启后引用链闭合（xiaomi_touch 驱动完整存在于
            # touchscreen/xiaomi/，Kconfig 符号有效），且与官方 munch stock 行为
            # 一致（双击唤醒/游戏模式用户态接口，HyperOS 触控调优依赖）。
            # 不选给源码加 #ifdef 的方案：会同时砍功能且 gesture.c 的
            # CONFIG_TOUCHSCREEN_COMMON 调用点也会断链，改动更大风险更高
            echo "CONFIG_TOUCHSCREEN_XIAOMI_TOUCHFEATURE=y" >> out/.config
            # 禁用 Smack：Run#11 实测 smack_lsm.c 20+ 处把 sk->sk_security（本树为
            # SELinux 专用内联数组）当 struct socket_smack * 指针用，与 AppArmor 的
            # SK_CTX 冲突同根同源。Android 实际只用 SELinux，munch 官方 stock 亦无
            # Smack，安全禁用；kconfig 解析后行覆盖前行，连带清掉全部子选项
            echo "# CONFIG_SECURITY_SMACK is not set" >> out/.config
            make O=out ARCH=arm64 olddefconfig
          else
            echo "!! Fragment not found: arch/arm64/configs/vendor/${DEVICE_FRAG}"
            exit 1
          fi
          # LTO 模式调整
          if [ "${LTO}" = "none" ]; then
            ./scripts/config --file out/.config -d LTO_CLANG_FULL -d LTO_CLANG_THIN -d LTO -d THINLTO -e LTO_NONE
            make O=out ARCH=arm64 olddefconfig
          elif [ "${LTO}" = "thin" ]; then
            ./scripts/config --file out/.config -d LTO_CLANG_FULL -d LTO_NONE -e LTO -e LTO_CLANG_THIN -e THINLTO
            make O=out ARCH=arm64 olddefconfig
          else
            # full：stock kona_defconfig 默认实为 ThinLTO，必须显式切到 Full LTO
            ./scripts/config --file out/.config -e LTO -e LTO_CLANG_FULL -d LTO_CLANG_THIN -d LTO_NONE -d THINLTO
            make O=out ARCH=arm64 olddefconfig
          fi
          # 三个无默认值 int 符号（arch/arm64/Kconfig:898-917）在 olddefconfig 后写出空值，
          # make 触发 syncconfig 时空值无效 → 交互式 Restart config → CI 无 stdin 死循环（1.3GB 日志刷屏根因）
          # 官方 munch-stock 同样不设置它们（kernel/cpu.c 全核回退），等价写 0
          sed -i -E 's/^(CONFIG_(LITTLE|BIG|PRIME)_CPU_MASK)=$/\1=0/' out/.config
          echo "=== remaining empty-value lines (diagnostic, string empties are legal) ==="
          grep -n '=$' out/.config || true
          # 硬校验关键配置全部生效（CHARGER_LN8000_MUNCH 是死配置，不验；由 BQ2597X_CHARGE_PUMP_STANDALONE_MUNCH 实际门控 67W 驱动）
          echo "=== Munch key configs ==="
          grep -E "CONFIG_(BOARD_MUNCH|QPNP_SMB5_MUNCH|FUEL_GAUGE_BQ27Z561_MUNCH|BQ2597X_CHARGE_PUMP_STANDALONE_MUNCH|THERMAL_DIMMING|WIFI_THREE_ANTENNA|USB_PD_POLICY_MUNCH|BOARD_XIAOMI|CPUSET_ASSIST|TOUCHSCREEN_XIAOMI_TOUCHFEATURE|SECURITY_SMACK)" out/.config
          for SYM in BOARD_XIAOMI BOARD_MUNCH QPNP_SMB5_MUNCH FUEL_GAUGE_BQ27Z561_MUNCH BQ2597X_CHARGE_PUMP_STANDALONE_MUNCH THERMAL_DIMMING WIFI_THREE_ANTENNA USB_PD_POLICY_MUNCH CPUSET_ASSIST TOUCHSCREEN_XIAOMI_TOUCHFEATURE; do
            if ! grep -q "CONFIG_${SYM}=y" out/.config; then
              echo "!! CONFIG_${SYM} not set, aborting"
              exit 1
            fi
          done
          # Smack 禁用校验：若被某依赖重新打开则在此立即失败（而不是跑到 security/ 才炸）
          if ! grep -q "^# CONFIG_SECURITY_SMACK is not set" out/.config; then
            echo "!! CONFIG_SECURITY_SMACK still enabled, aborting"
            grep -E "SECURITY_SMACK|DEFAULT_SECURITY|^CONFIG_LSM" out/.config || true
            exit 1
          fi

      - name: Patch D8G source fixes
        run: |
          # Run#9 根因修复：WALT trace 残留 + AppArmor SK_CTX 与 SELinux 内联数组冲突
          # Run#10 迭代：xarray API 在本树不存在（xarray.h 只有锁宏）→ 改 radix_tree；
          #             fair.c unregister_fair_sched_group 裸 raw_spin_lock 误传 rq → rq 感知版本
          # 补丁脚本经本地预演验证（幂等，重复执行安全）
          cat > patch_d8g.py <<'PATCH_EOF'
          #!/usr/bin/env python3
          import re, sys

          FAILED = []

          def sub(path, pattern, repl, count=1, flags=0, tag="", done_marker=None):
              with open(path, 'r', encoding='utf-8') as f:
                  s = f.read()
              new, n = re.subn(pattern, repl, s, count=count, flags=flags)
              if n:
                  with open(path, 'w', encoding='utf-8', newline='') as f:
                      f.write(new)
                  print("  patched %s (%d hit): %s" % (path, n, tag or pattern[:50]))
                  return
              if done_marker and done_marker in s:
                  print("  already patched, skip: %s (%s)" % (path, tag))
                  return
              FAILED.append("%s: %s" % (path, tag or pattern[:60]))

          TRACE_H = "include/trace/events/sched.h"

          sub(TRACE_H, r'(__entry->demand\s*=\s*)task_load\(p\);', r'\1task_util(p);',
              tag="enq_deq task_load", done_marker="task_util(p);")
          sub(TRACE_H, r'(__entry->pred_demand\s*=\s*)task_pl\(p\);', r'\g<1>0;',
              tag="enq_deq task_pl", done_marker="pred_demand\t= 0;")
          sub(TRACE_H, r'cfs_rq->avg\.runnable_load_avg', 'cfs_rq->avg.runnable_avg',
              tag="cfs_rq runnable_load_avg", done_marker="cfs_rq->avg.runnable_avg")
          sub(TRACE_H, r'se->avg\.runnable_load_avg', 'se->avg.runnable_avg',
              tag="se runnable_load_avg", done_marker="se->avg.runnable_avg")
          sub(TRACE_H, r'(__entry->cpu_util\s*=\s*)cpu_util\(cpu\);', r'\1__cpu_util(cpu);',
              tag="cpu_util", done_marker="__cpu_util(cpu);")
          sub(TRACE_H, r'(__entry->irqload\s*=\s*)sched_irqload\(cpu\);', r'\g<1>0;',
              tag="irqload", done_marker="irqload            = 0;")
          sub(TRACE_H, r'(__entry->reserved\s*=\s*)is_reserved\(cpu\);', r'\g<1>0;',
              tag="reserved", done_marker="reserved           = 0;")
          sub(TRACE_H, r'(__entry->high_irq_load\s*=\s*)sched_cpu_high_irqload\(cpu\);', r'\g<1>0;',
              tag="high_irq_load", done_marker="high_irq_load      = 0;")
          sub(TRACE_H, r'(__entry->nr_rtg_high_prio_tasks\s*=\s*)walt_nr_rtg_high_prio\(cpu\);', r'\g<1>0;',
              tag="nr_rtg_high_prio", done_marker="nr_rtg_high_prio_tasks = 0;")
          sub(TRACE_H, r'(__entry->high_irqload\s*=\s*)sched_cpu_high_irqload\(cpu\);', r'\g<1>0;',
              tag="core_ctl high_irqload", done_marker="high_irqload = 0;")

          LSM_C = "security/apparmor/lsm.c"

          AA_STORAGE = r'''/* D8G build fix: sk->sk_security is an SELinux-inline array on this tree;
           * AppArmor must not reuse it. Keep per-socket aa_sk_ctx in a private
           * radix tree keyed by the sock pointer instead.
           */
          #include <linux/radix-tree.h>
          static RADIX_TREE(aa_sk_ctx_tree, GFP_ATOMIC);

          static inline struct aa_sk_ctx *aa_sk_ctx_lookup(const struct sock *sk)
          {
          	return radix_tree_lookup(&aa_sk_ctx_tree, (unsigned long)sk);
          }

          static inline int aa_sk_ctx_store(struct sock *sk, struct aa_sk_ctx *ctx)
          {
          	return radix_tree_insert(&aa_sk_ctx_tree, (unsigned long)sk, ctx);
          }

          static inline void aa_sk_ctx_erase(struct sock *sk)
          {
          	radix_tree_delete(&aa_sk_ctx_tree, (unsigned long)sk);
          }'''

          with open(LSM_C, 'r', encoding='utf-8') as f:
              lsm = f.read()
          if 'aa_sk_ctx_tree' not in lsm:
              anchor = '#include "include/net.h"'
              assert anchor in lsm, "net.h include anchor missing"
              lsm = lsm.replace(anchor, anchor + '\n' + AA_STORAGE + '\n', 1)
              with open(LSM_C, 'w', encoding='utf-8', newline='') as f:
                  f.write(lsm)
              print("  injected aa_sk_ctx radix_tree storage into", LSM_C)
          else:
              print("  aa_sk_ctx storage already present, skip inject")

          sub(LSM_C,
              r'static int apparmor_sk_alloc_security\(struct sock \*sk, int family, gfp_t flags\)\s*\{.*?\n\}',
              lambda m: (
                  "static int apparmor_sk_alloc_security(struct sock *sk, int family, gfp_t flags)\n"
                  "{\n"
                  "\tstruct aa_sk_ctx *ctx;\n"
                  "\tint err;\n"
                  "\n"
                  "\tctx = kzalloc(sizeof(*ctx), flags);\n"
                  "\tif (!ctx)\n"
                  "\t\treturn -ENOMEM;\n"
                  "\n"
                  "\terr = aa_sk_ctx_store(sk, ctx);\n"
                  "\tif (err) {\n"
                  "\t\tkfree(ctx);\n"
                  "\t\treturn err;\n"
                  "\t}\n"
                  "\n"
                  "\treturn 0;\n"
                  "}"),
              flags=re.S, tag="sk_alloc_security", done_marker="err = aa_sk_ctx_store(sk, ctx);")

          sub(LSM_C,
              r'static void apparmor_sk_free_security\(struct sock \*sk\)\s*\{.*?\n\}',
              lambda m: (
                  "static void apparmor_sk_free_security(struct sock *sk)\n"
                  "{\n"
                  "\tstruct aa_sk_ctx *ctx = aa_sk_ctx_lookup(sk);\n"
                  "\n"
                  "\tif (!ctx)\n"
                  "\t\treturn;\n"
                  "\taa_sk_ctx_erase(sk);\n"
                  "\taa_put_label(ctx->label);\n"
                  "\taa_put_label(ctx->peer);\n"
                  "\tkfree(ctx);\n"
                  "}"),
              flags=re.S, tag="sk_free_security", done_marker="aa_sk_ctx_erase(sk);")

          sub(LSM_C,
              r'static void apparmor_sk_clone_security\(const struct sock \*sk,\s*\n\s*struct sock \*newsk\)\s*\{.*?\n\}',
              lambda m: (
                  "static void apparmor_sk_clone_security(const struct sock *sk,\n"
                  "\t\t\t\t       struct sock *newsk)\n"
                  "{\n"
                  "\tstruct aa_sk_ctx *ctx = aa_sk_ctx_lookup(sk);\n"
                  "\tstruct aa_sk_ctx *new = aa_sk_ctx_lookup(newsk);\n"
                  "\n"
                  "\tif (!ctx || !new)\n"
                  "\t\treturn;\n"
                  "\tif (new->label)\n"
                  "\t\taa_put_label(new->label);\n"
                  "\tnew->label = aa_get_label(ctx->label);\n"
                  "\n"
                  "\tif (new->peer)\n"
                  "\t\taa_put_label(new->peer);\n"
                  "\tnew->peer = aa_get_label(ctx->peer);\n"
                  "}"),
              flags=re.S, tag="sk_clone_security", done_marker="struct aa_sk_ctx *new = aa_sk_ctx_lookup(newsk);")

          # (e1) post_create 读点：SK_CTX → aa_sk_ctx_lookup，空表项直接跳过
          sub(LSM_C,
              r'struct aa_sk_ctx \*ctx = SK_CTX\(sock->sk\);\s*\n\s*\n\s*aa_put_label\(ctx->label\);\s*\n\s*ctx->label = aa_get_label\(label\);',
              lambda m: (
                  "struct aa_sk_ctx *ctx = aa_sk_ctx_lookup(sock->sk);\n"
                  "\n"
                  "\t\tif (ctx) {\n"
                  "\t\t\taa_put_label(ctx->label);\n"
                  "\t\t\tctx->label = aa_get_label(label);\n"
                  "\t\t}"),
              tag="post_create read", done_marker="if (ctx) {")

          # (e2) sk_peer_label 读点：SK_CTX → aa_sk_ctx_lookup，空表项按无 peer 处理
          sub(LSM_C,
              r'static struct aa_label \*sk_peer_label\(struct sock \*sk\)\s*\{\s*\n\s*struct aa_sk_ctx \*ctx = SK_CTX\(sk\);\s*\n\s*\n\s*if \(ctx->peer\)\s*\n\s*return ctx->peer;\s*\n\s*\n\s*return ERR_PTR\(-ENOPROTOOPT\);\s*\n\}',
              lambda m: (
                  "static struct aa_label *sk_peer_label(struct sock *sk)\n"
                  "{\n"
                  "\tstruct aa_sk_ctx *ctx = aa_sk_ctx_lookup(sk);\n"
                  "\n"
                  "\tif (ctx && ctx->peer)\n"
                  "\t\treturn ctx->peer;\n"
                  "\n"
                  "\treturn ERR_PTR(-ENOPROTOOPT);\n"
                  "}"),
              flags=re.S, tag="sk_peer_label read", done_marker="if (ctx && ctx->peer)")

          # (e3) sock_graft 读点：SK_CTX → aa_sk_ctx_lookup，空表项直接返回
          sub(LSM_C,
              r'static void apparmor_sock_graft\(struct sock \*sk, struct socket \*parent\)\s*\{\s*\n\s*struct aa_sk_ctx \*ctx = SK_CTX\(sk\);\s*\n\s*\n\s*if \(!ctx->label\)\s*\n\s*ctx->label = aa_get_current_label\(\);\s*\n\}',
              lambda m: (
                  "static void apparmor_sock_graft(struct sock *sk, struct socket *parent)\n"
                  "{\n"
                  "\tstruct aa_sk_ctx *ctx = aa_sk_ctx_lookup(sk);\n"
                  "\n"
                  "\tif (!ctx)\n"
                  "\t\treturn;\n"
                  "\tif (!ctx->label)\n"
                  "\t\tctx->label = aa_get_current_label();\n"
                  "}"),
              flags=re.S, tag="sock_graft read", done_marker="if (!ctx)\n\t\treturn;\n\tif (!ctx->label)")

          # ============================================================
          # 补丁 3: kernel/sched/fair.c —— unregister_fair_sched_group 裸锁修复
          #   根因: L12634/12636 用 raw_spin_lock_irqsave(rq, flags) 把 struct rq *
          #   传给了吃 raw_spinlock_t * 的通用宏（上游残留 bug，Run#10 实测 2 错误）。
          #   本树已有 rq 感知版本 raw_spin_rq_lock_irqsave/unlock_irqrestore
          #   （kernel/sched/sched.h，内部走 rq_lockp(rq)，支持 CONFIG_PREEMPT_RT）。
          #   同函数上方 sched_delayed 分支用的正是 rq 版本，照抄即可。
          # ============================================================
          FAIR_C = "kernel/sched/fair.c"

          sub(FAIR_C, r'raw_spin_lock_irqsave\(rq, flags\);',
              'raw_spin_rq_lock_irqsave(rq, flags);',
              tag="fair.c rq lock", done_marker="raw_spin_rq_lock_irqsave(rq, flags);")
          sub(FAIR_C, r'raw_spin_unlock_irqrestore\(rq, flags\);',
              'raw_spin_rq_unlock_irqrestore(rq, flags);',
              tag="fair.c rq unlock", done_marker="raw_spin_rq_unlock_irqrestore(rq, flags);")

          # ============================================================
          # 补丁 4: drivers/cpufreq/cpufreq_times.c —— procfs 接口迁移
          #   根因: Run#12 实测 6 处 error: cpufreq_times_init 的 proc_create_data
          #   传 const struct file_operations *，而本树 procfs 为 5.6+ 风格
          #   （proc_fs.h L75-77 要求 const struct proc_ops *）。
          #   6 个 fops 成员全部为 .open/.read/.llseek/.release，与 proc_ops
          #   的 proc_open/proc_read/proc_lseek/proc_release 一一对应且签名
          #   兼容，无 .owner/.write 等 proc_ops 无对应项的成员（已核对源码），
          #   与上游 5.6 转换方式完全一致。纯文本替换（grep 确认成员名各出
          #   现 6 次零歧义），count=6 全量替换。
          # ============================================================
          CPUFREQ_TIMES_C = "drivers/cpufreq/cpufreq_times.c"

          sub(CPUFREQ_TIMES_C, r'static const struct file_operations (\w+_fops) = \{',
              lambda m: 'static const struct proc_ops %s = {' % m.group(1),
              count=6, tag="cpufreq_times 6x fops decl",
              done_marker="static const struct proc_ops")
          sub(CPUFREQ_TIMES_C, r'\.open(\s*)=', r'.proc_open\1=',
              count=6, tag="cpufreq_times 6x proc_open", done_marker=".proc_open")
          sub(CPUFREQ_TIMES_C, r'\.read(\s*)=', r'.proc_read\1=',
              count=6, tag="cpufreq_times 6x proc_read", done_marker=".proc_read")
          sub(CPUFREQ_TIMES_C, r'\.llseek(\s*)=', r'.proc_lseek\1=',
              count=6, tag="cpufreq_times 6x proc_lseek", done_marker=".proc_lseek")
          sub(CPUFREQ_TIMES_C, r'\.release(\s*)=', r'.proc_release\1=',
              count=6, tag="cpufreq_times 6x proc_release", done_marker=".proc_release")

          # ============================================================
          # 补丁 5: drivers/input/touchscreen/nt36xxx —— procfs 接口迁移
          #   根因: Run#14 实测 nt36xxx.c:625 proc_create 传
          #   const struct file_operations *（本树 procfs 为 5.6+ 风格，
          #   要求 const struct proc_ops *）。kona_defconfig 中
          #   CONFIG_TOUCHSCREEN_NT36XXX=y 为官方 stock 配置，保功能不改 CONFIG，
          #   按上游 5.6 方式迁移。两文件共 5 个 fops（成员已逐一核对）：
          #   - nt36xxx.c nvt_flash_fops: .open/.release/.read（无 .owner/.llseek）
          #   - nt36xxx_ext_proc.c 4 个 fops: .owner/.open/.read/.llseek/.release
          #   签名兼容：open(int32_t*)/close/read 与 proc_* 原型一致；
          #   seq_read/seq_lseek/seq_release 正是上游 5.6 迁移的标准写法。
          #   .owner 是 file_operations 特有成员（proc_ops 无对应），删除之，
          #   procfs 条目无法被 rmmod 卸载故无需模块引用计数（上游同做法）。
          # ============================================================
          NT_C = "drivers/input/touchscreen/nt36xxx/nt36xxx.c"
          NT_EXT_C = "drivers/input/touchscreen/nt36xxx/nt36xxx_ext_proc.c"

          # nt36xxx.c: 1 个 fops（.open/.release/.read 各 1 处）
          sub(NT_C, r'static const struct file_operations (nvt_flash_fops) = \{',
              r'static const struct proc_ops \1 = {',
              tag="nt36xxx fops decl", done_marker="static const struct proc_ops nvt_flash_fops")
          sub(NT_C, r'\.open(\s*)=', r'.proc_open\1=',
              tag="nt36xxx proc_open", done_marker=".proc_open")
          sub(NT_C, r'\.read(\s*)=', r'.proc_read\1=',
              tag="nt36xxx proc_read", done_marker=".proc_read")
          sub(NT_C, r'\.release(\s*)=', r'.proc_release\1=',
              tag="nt36xxx proc_release", done_marker=".proc_release")

          # nt36xxx_ext_proc.c: 4 个 fops（.ownerx4 删除，其余各 4 处）
          sub(NT_EXT_C, r'\.owner(\s*)=\s*THIS_MODULE,(\s*\n)', r'\2',
              count=4, tag="nt36xxx_ext 4x owner removal", done_marker=".proc_open")
          sub(NT_EXT_C, r'static const struct file_operations (\w+_fops) = \{',
              lambda m: 'static const struct proc_ops %s = {' % m.group(1),
              count=4, tag="nt36xxx_ext 4x fops decl",
              done_marker="static const struct proc_ops")
          sub(NT_EXT_C, r'\.open(\s*)=', r'.proc_open\1=',
              count=4, tag="nt36xxx_ext 4x proc_open", done_marker=".proc_open")
          sub(NT_EXT_C, r'\.read(\s*)=', r'.proc_read\1=',
              count=4, tag="nt36xxx_ext 4x proc_read", done_marker=".proc_read")
          sub(NT_EXT_C, r'\.llseek(\s*)=', r'.proc_lseek\1=',
              count=4, tag="nt36xxx_ext 4x proc_lseek", done_marker=".proc_lseek")
          sub(NT_EXT_C, r'\.release(\s*)=', r'.proc_release\1=',
              count=5, tag="nt36xxx_ext 4x proc_release", done_marker=".proc_release")

          def assert_no(path, pattern, desc):
              with open(path, 'r', encoding='utf-8') as f:
                  s = f.read()
              if re.search(pattern, s):
                  FAILED.append("%s: leftover %s" % (path, desc))
              else:
                  print("  clean: %s has no %s" % (path, desc))

          assert_no(TRACE_H, r'(?<![a-zA-Z_])(task_load|task_pl|sched_irqload|is_reserved|sched_cpu_high_irqload|walt_nr_rtg_high_prio)\s*\(', "WALT function refs")
          assert_no(TRACE_H, r'runnable_load_avg', "runnable_load_avg")
          assert_no(TRACE_H, r'(?<![a-zA-Z_])cpu_util\(cpu\)', "bare cpu_util(cpu)")
          assert_no(LSM_C, r'\bSK_CTX\s*\(', "SK_CTX macro use")
          assert_no(LSM_C, r'\bDEFINE_XARRAY\b|\bxa_(load|store|erase|err)\s*\(', "xarray API refs")
          assert_no(FAIR_C, r'(?<!rq_)raw_spin_(un)?lock_irqsave\(\s*rq\s*,', "bare raw_spin_*lock_irqsave(rq")
          assert_no(CPUFREQ_TIMES_C, r'struct file_operations', "cpufreq_times fops decl")
          assert_no(NT_C, r'struct file_operations', "nt36xxx fops decl")
          assert_no(NT_EXT_C, r'struct file_operations', "nt36xxx_ext fops decl")
          assert_no(NT_EXT_C, r'\.owner\s*=', "nt36xxx_ext leftover owner")

          if FAILED:
              print("\n!! PATCH FAILURE:")
              for f in FAILED:
                  print("   -", f)
              sys.exit(1)
          print("\n== ALL PATCHES APPLIED CLEANLY ==")
          PATCH_EOF
          python3 patch_d8g.py

      - name: Build kernel
        run: |
          cd $GITHUB_WORKSPACE
          export PATH=$HOME/clang/bin:$PATH
          # 前置自检：工具链不完整立即失败，避免 syncconfig 死循环空跑
          for TOOL in clang clang++ ld.lld llvm-ar llvm-nm llvm-strip llvm-objcopy llvm-objdump llvm-readelf; do
            command -v "$TOOL" >/dev/null 2>&1 || { echo "!! required tool not in PATH: $TOOL"; exit 1; }
          done
          clang --version | head -1
          ld.lld --version | head -1
          # diphons 顶层 Makefile 为 GCC/gold plugin 追加 -plugin-opt=-warn-stack-size=... ，
          # Clang16 lld 不识别该透传参数 → vdso 链接必报错（Run#7 实测）。移除之，不影响功能。
          echo "=== before sed: warn-stack-size lines ==="
          grep -n 'warn-stack-size' Makefile || echo '(none)'
          sed -i '/-plugin-opt=-warn-stack-size/d' Makefile
          echo "=== after sed: warn-stack-size lines ==="
          grep -n 'warn-stack-size' Makefile || echo '(none)'
          # 超时防御：kconfig 死循环时最多烧 100 分钟，退出码 124 便于诊断
          timeout 100m make O=out ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            STRIP=llvm-strip \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            OBJSIZE=llvm-size \
            READELF=llvm-readelf \
            HOSTCC=clang \
            HOSTCXX=clang++ \
            HOSTAR=llvm-ar \
            HOSTLD=ld.lld \
            -j$(nproc)
          ls -la out/arch/arm64/boot/

      - name: Package AnyKernel3 zip
        run: |
          AK3=$GITHUB_WORKSPACE/AnyKernel3
          cp out/arch/arm64/boot/Image $AK3/
          rm -rf $AK3/.git $AK3/.github $AK3/README.md
          ZIP_NAME="D8G-munch-$(date +%Y%m%d)-${GITHUB_RUN_NUMBER}.zip"
          cd $AK3
          zip -r9 "$GITHUB_WORKSPACE/${ZIP_NAME}" . -x ".git*" -x "*.github*"
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
          cd $GITHUB_WORKSPACE
          ls -la *.zip
          # 显示内核版本信息
          strings out/arch/arm64/boot/Image | grep -m1 "Linux version" || true

      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: |
            *.zip

      - name: Upload build config
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: munch-build-config
          path: out/.config
          if-no-files-found: ignore
